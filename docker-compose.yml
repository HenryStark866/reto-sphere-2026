services:
  sara-postop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sara-postop
    env_file:
      - .env
    environment:
      PORT: 8080
      PYTHONUTF8: "1"
    ports:
      - "8000:8080"
    volumes:
      - type: bind
        source: ./data
        target: /tmp/datos
      - type: bind
        source: ./logs
        target: /tmp/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/salud').read(1)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
